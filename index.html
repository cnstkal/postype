<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>팬픽 아카이브</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');

  :root{
    --bg:#FAFAFA;
    --ink:#161616;
    --ink-soft:#8A8A8A;
    --accent:#2F5CE0;
    --accent-soft:#EAEFFC;
    --line:#E7E7E7;
    --card:#FFFFFF;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Pretendard', sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .wrap{max-width:760px;margin:0 auto;padding:64px 24px 120px;}

  header{
    margin-bottom:40px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:16px;
  }
  .header-text{flex:1;}
  h1{
    font-family:'Pretendard', sans-serif;
    font-size:26px;
    font-weight:700;
    margin:0 0 8px;
    line-height:1.3;
    letter-spacing:-0.02em;
  }
  .sub{color:var(--ink-soft);font-size:14px;line-height:1.6;max-width:520px;}

  .ext-link{
    flex-shrink:0;
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:9px 14px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--card);
    color:var(--ink);
    font-size:13px;
    font-weight:600;
    text-decoration:none;
    white-space:nowrap;
    transition:border-color .15s, color .15s;
  }
  .ext-link:hover{border-color:var(--accent); color:var(--accent);}

  .survey-cta{
    display:block;
    width:100%;
    padding:14px;
    margin-bottom:20px;
    background:var(--ink);
    color:var(--paper, #fff);
    border:none;
    border-radius:10px;
    font-family:inherit;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    transition:background .15s;
  }
  .survey-cta:hover{background:var(--accent);}

  .modal-overlay{
    display:none;
    position:fixed; inset:0;
    background:rgba(0,0,0,0.45);
    align-items:center; justify-content:center;
    padding:20px;
    z-index:100;
  }
  .modal-overlay.open{display:flex;}
  .modal-box{
    background:var(--card);
    border-radius:14px;
    width:100%; max-width:560px;
    max-height:85vh;
    overflow-y:auto;
    padding:0;
  }
  .modal-head{
    display:flex; justify-content:space-between; align-items:center;
    padding:20px 22px 12px;
    position:sticky; top:0; background:var(--card);
  }
  .modal-head h2{font-size:18px; margin:0; font-weight:700;}
  .modal-close{
    background:none; border:none; font-size:16px; color:var(--ink-soft);
    cursor:pointer;
  }
  .modal-body{padding:4px 22px 24px;}
  .q-block{margin-bottom:20px;}
  .q-block label{
    display:block; font-size:13px; font-weight:600; color:var(--ink-soft);
    margin-bottom:8px;
  }
  .chip-pick{display:flex; flex-wrap:wrap; gap:6px;}
  .chip-pick .seg-btn{padding:7px 13px; font-size:12.5px;}

  .survey-progress{
    display:flex; gap:6px; padding:0 22px; margin-bottom:18px;
  }
  .survey-progress .dot{
    flex:1; height:4px; border-radius:999px; background:var(--line);
    transition:background .2s;
  }
  .survey-progress .dot.done{background:var(--accent);}
  .survey-progress .dot.current{background:var(--ink);}

  .survey-qhead{
    padding:0 22px; margin-bottom:18px;
  }
  .survey-qcount{
    font-size:12px; font-weight:700; color:var(--accent); margin-bottom:6px;
  }
  .survey-qtitle{
    font-size:17px; font-weight:700; line-height:1.4; letter-spacing:-0.01em;
  }

  .survey-options{
    padding:0 22px; display:flex; flex-direction:column; gap:10px; margin-bottom:20px;
  }
  .survey-opt{
    padding:16px 14px;
    border:1.5px solid var(--line);
    border-radius:12px;
    background:var(--card);
    color:var(--ink);
    font-family:inherit;
    font-size:13.5px;
    font-weight:600;
    line-height:1.4;
    text-align:left;
    cursor:pointer;
    transition:border-color .15s, background .15s, transform .1s;
  }
  .survey-opt:hover{border-color:var(--accent); background:var(--accent-soft);}
  .survey-opt:active{transform:scale(0.98);}
  .survey-opt.picked{border-color:var(--accent); background:var(--accent); color:#fff;}

  .survey-nav{
    display:flex; justify-content:space-between; align-items:center;
    padding:0 22px 22px;
  }
  .survey-back{
    background:none; border:none; color:var(--ink-soft); font-size:13px;
    font-family:inherit; cursor:pointer; padding:8px 4px;
  }
  .survey-back:hover{color:var(--ink);}
  .survey-back:disabled{visibility:hidden;}
  .survey-skip{
    background:none; border:none; color:var(--ink-soft); font-size:12.5px;
    font-family:inherit; cursor:pointer; text-decoration:underline; padding:8px 4px;
  }
  .survey-skip:hover{color:var(--accent);}

  .survey-submit{
    width:100%;
    padding:13px;
    background:var(--ink);
    color:var(--paper,#fff);
    border:none;
    border-radius:8px;
    font-family:inherit;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
  }
  .survey-submit:hover{background:var(--accent);}
  .result-head{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:16px; font-size:13px; color:var(--ink-soft);
  }
  .link-btn{
    background:none; border:none; color:var(--accent);
    font-size:13px; cursor:pointer; font-family:inherit;
  }
  .result-card{
    border:1px solid var(--line); border-radius:10px;
    padding:14px 16px; margin-bottom:10px;
  }
  .result-card .rtitle{
    font-weight:700; font-size:15px; text-decoration:none; color:var(--ink);
  }
  .result-card .rtitle:hover{color:var(--accent);}
  .result-card .rauthor{font-size:12px; color:var(--ink-soft); margin-left:8px;}
  .result-card .rmatch{font-size:12px; color:var(--accent); margin-top:6px;}

  .search-row{
    display:flex; gap:10px; margin-bottom:36px;
  }
  .search-row input{
    flex:1;
    padding:14px 16px;
    border:1.5px solid var(--line);
    background:var(--card);
    border-radius:10px;
    font-size:15px;
    font-family:inherit;
    color:var(--ink);
    outline:none;
    transition:border-color .15s;
  }
  .search-row input:focus{border-color:var(--accent);}

  .filter-tabs{display:flex;gap:6px;margin-bottom:28px;flex-wrap:wrap;}
  .filter-tabs button{
    padding:7px 14px;
    border-radius:999px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--ink-soft);
    font-size:13px;
    cursor:pointer;
    font-family:inherit;
    transition:all .15s;
  }
  .filter-tabs button.active{
    background:var(--accent); border-color:var(--accent); color:#fff;
  }

  details.add-box{
    margin-bottom:40px;
    border:1px solid var(--line);
    border-radius:12px;
    background:var(--card);
    padding:0;
    overflow:hidden;
  }
  details.add-box summary{
    padding:16px 20px;
    cursor:pointer;
    font-weight:600;
    font-size:14px;
    color:var(--ink);
    list-style:none;
    display:flex; align-items:center; gap:8px;
  }
  details.add-box summary::before{
    content:"＋"; color:var(--accent); font-size:16px; font-weight:700;
  }
  details.add-box[open] summary::before{content:"－";}
  .add-form{
    padding:4px 20px 22px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  .add-form .full{grid-column:1/-1;}
  .add-form label{
    font-size:12px; color:var(--ink-soft); margin-bottom:5px; display:block;
  }
  .add-form input{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    font-family:inherit;
    font-size:14px;
    background:#fff;
    color:var(--ink);
  }
  .add-form input:focus{outline:none; border-color:var(--accent);}
  .add-form button[type="submit"]{
    grid-column:1/-1;
    margin-top:6px;
    padding:12px;
    background:var(--ink);
    color:var(--paper);
    border:none;
    border-radius:8px;
    font-family:inherit;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    transition:background .15s;
  }
  .add-form button[type="submit"]:hover{background:var(--accent);}
  .add-form-cancel{
    grid-column:1/-1;
    padding:10px;
    background:none;
    border:1px solid var(--line);
    border-radius:8px;
    color:var(--ink-soft);
    font-family:inherit;
    font-size:13px;
    cursor:pointer;
  }
  .add-form-cancel:hover{border-color:var(--ink-soft); color:var(--ink);}
  .add-form .msg{grid-column:1/-1; font-size:13px; color:var(--accent); min-height:16px;}

  .seg{display:flex; gap:6px;}
  .cp-seg{flex-wrap:wrap;}
  .seg-btn{
    padding:9px 16px;
    border:1px solid var(--line);
    border-radius:8px;
    background:#fff;
    color:var(--ink-soft);
    font-family:inherit;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  .seg-btn.active{
    background:var(--ink);
    border-color:var(--ink);
    color:#fff;
  }
  .seg-extra{
    background:#F5F5F5;
    border-radius:8px;
    padding:14px;
  }
  .extra-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  .extra-row label{font-size:12px; color:var(--ink-soft); margin-bottom:5px; display:block;}
  .extra-row input{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    font-family:inherit;
    font-size:14px;
    background:#fff;
    color:var(--ink);
  }

  .count-row{
    font-size:13px; color:var(--ink-soft); margin-bottom:14px;
  }

  .list{display:flex; flex-direction:column; gap:14px;}
  .post-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:20px 22px;
    display:flex;
    flex-direction:column;
    gap:8px;
    transition:border-color .15s, transform .1s;
  }
  .post-card:hover{border-color:var(--accent);}
  .post-top{display:flex; justify-content:space-between; align-items:flex-start; gap:12px;}
  .post-title{
    font-family:'Pretendard', sans-serif;
    font-weight:700;
    font-size:19px;
    line-height:1.4;
    color:var(--ink);
    text-decoration:none;
  }
  .post-title:hover{color:var(--accent);}
  .post-author{
    font-size:13px; color:var(--ink-soft);
    white-space:nowrap; padding-top:4px;
  }
  .badge-row{display:flex; gap:6px; flex-wrap:wrap;}
  .badge{
    font-size:11px;
    padding:2px 8px;
    border-radius:5px;
    font-weight:600;
    background:#F0F0F0;
    color:var(--ink-soft);
  }
  .badge.ongoing{background:#FFF3D6; color:#9A6B00;}
  .badge.done{background:#E8F5EA; color:#2E7D32;}
  .badge.age19{background:#2A2A2A; color:#fff;}
  .badge.age15{background:#FDECC8; color:#9A5B00;}
  .badge.lang{background:var(--accent-soft); color:var(--accent);}
  .badge.site{background:#F1F1F1; color:var(--ink-soft);}
  .tag-line{
    display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 0;
    font-size:13px; line-height:1.7;
  }
  .tag-line .kw-label{
    font-size:12px; color:var(--ink-soft); font-weight:600;
    margin-right:8px; flex-shrink:0;
    width:28px; display:inline-block;
  }
  .tag-line .kw{
    background:none; border:none; padding:0; cursor:pointer;
    font-family:inherit; font-size:13px; font-weight:400;
    color:var(--ink);
  }
  .tag-line .kw:hover{color:var(--accent); text-decoration:underline;}
  .tag-line .kw + .kw::before{
    content:"·"; color:var(--line); margin:0 7px; text-decoration:none;
  }
  .tag-line .kw.cp{color:#7A3FC2; font-weight:600;}
  .card-actions{
    display:flex; gap:12px; justify-self:flex-end; margin-left:auto;
  }
  .action-btn{
    background:none;border:none;color:var(--ink-soft);
    font-size:12px;cursor:pointer;
    padding:0;
  }
  .action-btn:hover{color:var(--accent);}
  .action-btn.danger:hover{color:#D14B32;}

  .empty{
    text-align:center; padding:60px 20px; color:var(--ink-soft);
    font-family:'Pretendard', sans-serif; font-size:16px;
  }

  @media (max-width:600px){
    .wrap{padding:36px 16px 100px;}
    h1{font-size:22px;}
    .add-form{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="header-text">
      <h1>팬픽 추천 아카이브</h1>
      <p class="sub">제목, 작가, 키워드로 검색하고 바로 원문으로 이동하세요.</p>
    </div>
    <a class="ext-link" href="https://syosetu.colomo.dev/" target="_blank" rel="noopener noreferrer">콜로모 번역기 ↗</a>
  </header>

  <button class="survey-cta" id="openSurvey">🎯 취향 설문하고 추천받기</button>

  <div class="search-row">
    <input type="text" id="searchInput" placeholder="제목 / 작가 / 키워드로 검색…">
  </div>
  <div class="filter-tabs" id="ageTabs">
    <button data-age="all" class="active">전체</button>
    <button data-age="all-ages">전체연령</button>
    <button data-age="15">15금</button>
    <button data-age="19">19금</button>
  </div>
  <div class="filter-tabs" id="langTabs">
    <button data-lang="all" class="active">언어 전체</button>
    <button data-lang="영어">영어</button>
    <button data-lang="중국어">중국어</button>
    <button data-lang="러시아어">러시아어</button>
    <button data-lang="프랑스어">프랑스어</button>
    <button data-lang="포르투갈어">포르투갈어</button>
  </div>

  <details class="add-box" id="addBox">
    <summary id="addBoxSummary">새 글 등록하기</summary>
    <form class="add-form" id="addForm" autocomplete="off">
      <div class="full">
        <label>제목</label>
        <input type="text" id="f_title" required placeholder="글 제목" autocomplete="off">
      </div>
      <div>
        <label>작가</label>
        <input type="text" id="f_author" required placeholder="작가명" autocomplete="off">
      </div>
      <div>
        <label>링크</label>
        <input type="url" id="f_link" required placeholder="https://..." autocomplete="off">
      </div>
      <div class="full">
        <label>게재 사이트</label>
        <div class="seg" id="siteSeg">
          <button type="button" class="seg-btn" data-val="AO3">AO3</button>
          <button type="button" class="seg-btn" data-val="픽북">픽북</button>
          <button type="button" class="seg-btn" data-val="웨이보">웨이보</button>
        </div>
      </div>
      <div class="full">
        <label>원문 언어</label>
        <div class="seg" id="langSeg">
          <button type="button" class="seg-btn" data-val="영어">영어</button>
          <button type="button" class="seg-btn" data-val="중국어">중국어</button>
          <button type="button" class="seg-btn" data-val="러시아어">러시아어</button>
          <button type="button" class="seg-btn" data-val="프랑스어">프랑스어</button>
          <button type="button" class="seg-btn" data-val="포르투갈어">포르투갈어</button>
        </div>
      </div>
      <div>
        <label>장르 키워드 (쉼표로 구분)</label>
        <input type="text" id="f_genre" placeholder="예: 로맨스, 회귀, 현판, 힐링" autocomplete="off">
      </div>
      <div>
        <label>공수 키워드 (쉼표로 구분)</label>
        <input type="text" id="f_pairing" placeholder="예: 유공, 순정남수, 서로공수" autocomplete="off">
      </div>

      <div class="full">
        <label>CP (복수 선택 가능)</label>
        <div class="seg cp-seg" id="cpSeg">
          <button type="button" class="seg-btn" data-val="섷윤">섷윤</button>
          <button type="button" class="seg-btn" data-val="몽윦">몽윦</button>
          <button type="button" class="seg-btn" data-val="솽윦">솽윦</button>
          <button type="button" class="seg-btn" data-val="낫윤">낫윤</button>
          <button type="button" class="seg-btn" data-val="밍윦">밍윦</button>
          <button type="button" class="seg-btn" data-val="웡윤">웡윤</button>
          <button type="button" class="seg-btn" data-val="쫑윦">쫑윦</button>
          <button type="button" class="seg-btn" data-val="윦른">윦른</button>
        </div>
      </div>

      <div class="full">
        <label>연령 등급</label>
        <div class="seg" id="ageSeg">
          <button type="button" class="seg-btn active" data-val="all-ages">전체연령</button>
          <button type="button" class="seg-btn" data-val="15">15금</button>
          <button type="button" class="seg-btn" data-val="19">19금</button>
        </div>
      </div>

      <div class="full">
        <label>연재 구분</label>
        <div class="seg" id="lengthSeg">
          <button type="button" class="seg-btn active" data-val="단편">단편</button>
          <button type="button" class="seg-btn" data-val="장편">장편</button>
        </div>
      </div>

      <div class="full seg-extra" id="lengthExtra" style="display:none;">
        <div class="extra-row">
          <div>
            <label>총 화수</label>
            <input type="number" id="f_episodes" min="1" placeholder="예: 24" autocomplete="off">
          </div>
          <div>
            <label>연재 상태</label>
            <div class="seg" id="statusSeg">
              <button type="button" class="seg-btn active" data-val="완결">완결</button>
              <button type="button" class="seg-btn" data-val="미완결">미완결</button>
            </div>
          </div>
        </div>
      </div>

      <button type="submit" id="submitBtn">등록하기</button>
      <button type="button" id="cancelEditBtn" class="add-form-cancel" style="display:none;">취소</button>
      <div class="msg" id="formMsg"></div>
    </form>
  </details>

  <div class="count-row" id="countRow"></div>
  <div class="list" id="list"></div>
  <div class="empty" id="emptyMsg" style="display:none;">아직 등록된 글이 없어요. 위에서 새 글을 등록해보세요.</div>
</div>

<div class="modal-overlay" id="surveyOverlay">
  <div class="modal-box">
    <div class="modal-head">
      <h2>취향 설문</h2>
      <button class="modal-close" id="closeSurvey">✕</button>
    </div>

    <div class="modal-body" id="surveyForm">
      <div class="survey-progress" id="surveyProgress"></div>
      <div class="survey-qhead">
        <div class="survey-qcount" id="surveyQCount"></div>
        <div class="survey-qtitle" id="surveyQTitle"></div>
      </div>
      <div class="survey-options" id="surveyOptions"></div>
      <div class="survey-nav">
        <button type="button" class="survey-back" id="surveyBack">← 이전</button>
        <button type="button" class="survey-skip" id="surveySkip">이 질문은 건너뛸게요</button>
      </div>
    </div>

    <div class="modal-body" id="surveyResults" style="display:none;">
      <div class="result-head">
        <span id="resultCount"></span>
        <button type="button" id="surveyRetry" class="link-btn">다시 설문하기</button>
      </div>
      <div id="resultList"></div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc,
    query, orderBy, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyARs6k0H3CMkyxUY4S18HhAT40uF8EzG0E",

    projectId: "postype-47733",

  function startEdit(post){
    editingId = post.id;
    document.getElementById("f_title").value = post.title || "";
    document.getElementById("f_author").value = post.author || "";
    document.getElementById("f_link").value = post.link || "";
    siteValue = post.site || null;
    [...siteSeg.children].forEach(b => b.classList.toggle("active", b.dataset.val === siteValue));
    langValue = post.language || null;
    [...langSeg.children].forEach(b => b.classList.toggle("active", b.dataset.val === langValue));
    document.getElementById("f_genre").value = (post.genreKeywords || post.keywords || []).join(", ");
    document.getElementById("f_pairing").value = (post.pairingKeywords || []).join(", ");

    lengthType = post.lengthType === "장편" ? "장편" : "단편";
    [...lengthSeg.children].forEach(b => b.classList.toggle("active", b.dataset.val === lengthType));
    lengthExtra.style.display = lengthType === "장편" ? "block" : "none";
    document.getElementById("f_episodes").value = post.episodes || "";

    statusType = post.status === "미완결" ? "미완결" : "완결";
    [...statusSeg.children].forEach(b => b.classList.toggle("active", b.dataset.val === statusType));

    selectedCp = [...(post.cp || [])];
    [...cpSeg.children].forEach(b => b.classList.toggle("active", selectedCp.includes(b.dataset.val)));

    ageValue = (post.age === "19" || post.age === "15") ? post.age : "all-ages";
    [...ageSeg.children].forEach(b => b.classList.toggle("active", b.dataset.val === ageValue));

    addBoxSummary.textContent = "글 수정하기";
    submitBtn.textContent = "수정 완료";
    cancelEditBtn.style.display = "block";
    addBox.open = true;
    addBox.scrollIntoView({ behavior: "smooth", block: "start" });
  }

    addForm.reset();

    lengthType = "단편";
    lengthExtra.style.display = "none";
    [...statusSeg.children].forEach(b => b.classList.remove("active"));

    if(!btn) return;
    const val = btn.dataset.val;
    if(selectedCp.includes(val)){
      selectedCp = selectedCp.filter(v => v !== val);
      btn.classList.remove("active");
    } else {
      selectedCp.push(val);
      btn.classList.add("active");
    }
  });

  searchInput.addEventListener("input", render);

  async function loadPosts(){
    try{
      const q = query(postsRef, orderBy("createdAt", "desc"));
      const snap = await getDocs(q);
      allPosts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    }catch(err){
      // orderBy may fail if createdAt missing on old docs; fallback
      const snap = await getDocs(postsRef);
      allPosts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    }
    render();
  }

  function matches(post, term){
    if(!term) return true;
    const t = term.toLowerCase();
    const genre = (post.genreKeywords || post.keywords || []).join(" ").toLowerCase();
    const pairing = (post.pairingKeywords || []).join(" ").toLowerCase();
    const cp = (post.cp || []).join(" ").toLowerCase();
    return (post.title||"").toLowerCase().includes(t)
      || (post.author||"").toLowerCase().includes(t)
      || genre.includes(t)
      || pairing.includes(t)
      || cp.includes(t);
  }

  function render(){
    const term = searchInput.value.trim();
    let filtered = allPosts.filter(p => matches(p, term));
    if(ageFilter !== "all") filtered = filtered.filter(p => (p.age || "all-ages") === ageFilter);
    if(langFilter !== "all") filtered = filtered.filter(p => p.language === langFilter);

    countRow.textContent = `총 ${allPosts.length}편 중 ${filtered.length}편`;
    listEl.innerHTML = "";
    emptyMsg.style.display = filtered.length === 0 ? "block" : "none";
    if(filtered.length === 0 && allPosts.length > 0){
      emptyMsg.textContent = "검색 결과가 없어요.";
    } else if (allPosts.length === 0){
      emptyMsg.textContent = "아직 등록된 글이 없어요. 위에서 새 글을 등록해보세요.";
    }

    filtered.forEach(post => {
      const card = document.createElement("div");
      card.className = "post-card";

      const top = document.createElement("div");
      top.className = "post-top";

      const a = document.createElement("a");
      a.href = post.link;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.className = "post-title";
      a.textContent = post.title;

      const author = document.createElement("div");
      author.className = "post-author";
      author.textContent = post.author ? `by ${post.author}` : "";

      top.appendChild(a);
      top.appendChild(author);
      card.appendChild(top);

      const badgeRow = document.createElement("div");
      badgeRow.className = "badge-row";
      const lengthBadge = document.createElement("span");
      lengthBadge.className = "badge";
      if(post.lengthType === "장편"){
        const epi = post.episodes ? `전 ${post.episodes}화` : "장편";
        lengthBadge.textContent = epi;
        badgeRow.appendChild(lengthBadge);

        const statusBadge = document.createElement("span");
        statusBadge.className = "badge " + (post.status === "완결" ? "done" : "ongoing");
        statusBadge.textContent = post.status || "미완결";
        badgeRow.appendChild(statusBadge);
      } else {
        lengthBadge.textContent = "단편";
        badgeRow.appendChild(lengthBadge);
      }
      if(post.age === "19"){
        const ageBadge = document.createElement("span");
        ageBadge.className = "badge age19";
        ageBadge.textContent = "19금";
        badgeRow.appendChild(ageBadge);
      } else if(post.age === "15"){
        const ageBadge = document.createElement("span");
        ageBadge.className = "badge age15";
        ageBadge.textContent = "15금";
        badgeRow.appendChild(ageBadge);
      }
      if(post.language){
        const langBadge = document.createElement("span");
        langBadge.className = "badge lang";
        langBadge.textContent = post.language;
        badgeRow.appendChild(langBadge);
      }
      if(post.site){
        const siteBadge = document.createElement("span");
        siteBadge.className = "badge site";
        siteBadge.textContent = post.site;
        badgeRow.appendChild(siteBadge);
      }
      card.appendChild(badgeRow);

      const genreList = post.genreKeywords || post.keywords || [];
      const pairingList = post.pairingKeywords || [];

      function addChipRow(list, type, labelText){
        if(!list.length) return;
        const kwWrap = document.createElement("div");
        kwWrap.className = "tag-line";
        const label = document.createElement("span");
        label.className = "kw-label";
        label.textContent = labelText;
        kwWrap.appendChild(label);
        list.forEach(k => {
          const chip = document.createElement("button");
          chip.className = "kw " + type;
          chip.textContent = k;
          chip.onclick = () => {
            searchInput.value = k;
            render();
          };
          kwWrap.appendChild(chip);
        });
        card.appendChild(kwWrap);
      }

      addChipRow(genreList, "genre", "장르");
      addChipRow(pairingList, "pairing", "공수");
      addChipRow(post.cp || [], "cp", "CP");

      const actions = document.createElement("div");
      actions.className = "card-actions";

      const editBtn = document.createElement("button");
      editBtn.className = "action-btn";
      editBtn.textContent = "수정";
      editBtn.onclick = () => startEdit(post);
      actions.appendChild(editBtn);

      const del = document.createElement("button");
      del.className = "action-btn danger";
      del.textContent = "삭제";
      del.onclick = async () => {
        if(!confirm("이 글을 목록에서 삭제할까요?")) return;
        await deleteDoc(doc(db, "posts", post.id));
        await loadPosts();
      };
      actions.appendChild(del);

      card.appendChild(actions);

      listEl.appendChild(card);
    });
  }

  addForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const title = document.getElementById("f_title").value.trim();
    const author = document.getElementById("f_author").value.trim();
    const link = document.getElementById("f_link").value.trim();
    const site = siteValue;
    const genreKeywords = document.getElementById("f_genre").value
      .split(",").map(s => s.trim()).filter(Boolean);
    const pairingKeywords = document.getElementById("f_pairing").value
      .split(",").map(s => s.trim()).filter(Boolean);
    const episodes = lengthType === "장편"
      ? (parseInt(document.getElementById("f_episodes").value, 10) || null)
      : null;
    const status = lengthType === "장편" ? statusType : null;

    if(!title || !author || !link){
      formMsg.textContent = "제목, 작가, 링크는 필수예요.";
      return;
    }

    formMsg.textContent = editingId ? "수정 중…" : "등록 중…";
    try{
      const payload = {
        title, author, link, site, language: langValue, genreKeywords, pairingKeywords,
        lengthType, episodes, status, cp: selectedCp, age: ageValue
      };
      if(editingId){
        await updateDoc(doc(db, "posts", editingId), payload);
      } else {
        await addDoc(postsRef, { ...payload, createdAt: serverTimestamp() });
      }
      const wasEditing = !!editingId;
      resetFormState();
      formMsg.textContent = wasEditing ? "수정 완료!" : "등록 완료!";
      setTimeout(() => formMsg.textContent = "", 1500);
      await loadPosts();
    }catch(err){
      formMsg.textContent = (editingId ? "수정" : "등록") + " 중 오류가 발생했어요: " + err.message;
    }
  });

    { label: "위험한 존재에게 홀리는 것도 나쁘지 않아", value: "악마공" },
    { label: "상대를 제멋대로 휘두르는 사람이 끌려", value: "능욕공" },
    { label: "혼자 오래 마음 품어온 사람이 좋아", value: "짝사랑공" },
    { label: "처음부터 모든 게 계획이었다면?", value: "계략공" },
    { label: "사랑하는 상대가 꼭 인간일 필요는 없잖아", value: "인외공" },
    { label: "아무것도 모르는 얼굴이 더 귀여워", value: "순진공" },

    { label: "자기가 사랑받을 수 있다는 걸 몰랐으면 좋겠어", value: "자낮공" },
    { label: "놀 만큼 놀아본 사람도 나쁘지 않아", value: "문란공" },

    { label: "마음 정했으면 앞만 보고 달려왔으면 좋겠어", value: "직진공" },
    { label: "위에 서는 사람이 꼭 익숙한 형질일 필요는 없잖아", value: "오메가공" },
    { label: "본능부터 강하게 타고난 사람이 좋아", value: "알파공" },
    { label: "도통 속을 알 수 없는 사람이 끌려", value: "무심공" },
    { label: "관계의 주도권을 확실히 쥐는 사람이 좋아", value: "돔탑" }
  ];

  const SOO_POOL = [
    { label: "쉽게 휘둘리지 않는 사람이 좋아", value: "강수" },
    { label: "좀 많이 고생해야 더 맛있는 법이지", value: "굴림수" },
    { label: "마음 한구석에 오래된 아픔이 있었으면 좋겠어", value: "상처수" },
    { label: "가만히 기다리지만 말고 먼저 다가갔으면 좋겠어", value: "적극수" },
    { label: "욕망에 솔직한 게 뭐 어때", value: "음란수" },
    { label: "먼저 홀려놓는 쪽이어도 재밌잖아", value: "유혹수" },
    { label: "귀하게 아껴지는 사람이 좋아", value: "손중수" },
    { label: "아픈 것조차 싫지만은 않았으면 좋겠어", value: "마조수" },
    { label: "마음씨가 따뜻한 사람에게 끌려", value: "다정수" },
    { label: "마음속에 단 한 사람만 있었으면 좋겠어", value: "순정수" },
    { label: "뒤늦게 자기 마음을 깨닫는 것도 맛있어", value: "후회수" },
    { label: "본능에 흔들리는 모습도 보고 싶어", value: "오메가수" },
    { label: "강한 사람이 아래에 있는 것도 좋잖아", value: "알파수" },
    { label: "둘 사이에 새로운 존재가 생겼으면 좋겠어", value: "임신수" },
    { label: "쉽게 곁을 내주지 않는 사람이 좋아", value: "까칠수" },
    { label: "자기 자신에게 유독 자신이 없었으면 좋겠어", value: "자낮수" },
    { label: "아직 세상 물정 모르는 구석이 있었으면 좋겠어", value: "순진수" },
    { label: "혼자 오래 마음앓이했으면 좋겠어", value: "짝사랑수" },
    { label: "웬만한 일에는 별 관심도 없었으면 좋겠어", value: "무심수" }
  ];

  function shuffle(arr){
    const a = [...arr];
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }

  // answers accumulate as user progresses
  let answers = {};
  let questions = [];
  let qIndex = 0;

  function buildQuestions(){
    answers = { genre:null, gong:null, soo:null, cp:null, age:null, length:null };
    questions = [
      {
        key: "genre",
        title: "요즘 자꾸 손이 가는 것은",
        options: shuffle(GENRE_POOL).slice(0, 6)
      },
      {
        key: "gong",
        title: "좋아하는 공 키워드는?",
        options: shuffle(GONG_POOL).slice(0, 6)
      },
      {
        key: "soo",
        title: "좋아하는 수 키워드는?",
        options: shuffle(SOO_POOL).slice(0, 6)
      },
      {
        key: "cp",
        title: "끌리는 조합이 있다면?",
        options: shuffle(CP_POOL)
      },
      {
        key: "age",
        title: "수위는 어느 정도가 좋아요?",
        options: [
          { label: "손만 잡아도 충분히 설렐 수 있어", value: "전체이용가" },
          { label: "키스 그 이상은 살짝 아슬아슬한 정도가 좋아", value: "15세" },
          { label: "굳이 중요한 장면을 건너뛸 필요는 없잖아", value: "19세" },
          { label: "딱히 상관없어", value: "all" }
        ]
      },
      {
        key: "length",
        title: "분량은 어느 정도가 좋아요?",
        options: [
          { label: "짧고 굵게 한 번에 끝내는 게 좋아", value: "단편" },
          { label: "짧은 이야기를 이것저것 골라 먹는 게 좋아", value: "단편집" },
          { label: "적당히 오래 빠져 있을 수 있는 이야기가 좋아", value: "중장편" },
          { label: "한번 빠지면 한동안 헤어나오고 싶지 않아", value: "장편" },
          { label: "아무거나 상관없어", value: "all" }
        ]
      }
    ];
  }

  function renderProgress(){
    surveyProgressEl.innerHTML = "";
    questions.forEach((_, i) => {
      const dot = document.createElement("div");
      dot.className = "dot" + (i < qIndex ? " done" : i === qIndex ? " current" : "");
      surveyProgressEl.appendChild(dot);
    });
  }

  function renderStep(){
    renderProgress();
    const q = questions[qIndex];
    surveyQCountEl.textContent = `Q${qIndex+1} / ${questions.length}`;
    surveyQTitleEl.textContent = q.title;
    surveyOptionsEl.innerHTML = "";
    if(q.type === "text"){
      const ta = document.createElement("textarea");
      ta.className = "survey-opt";
      ta.style.cssText = "width:100%;min-height:80px;resize:vertical;text-align:left;white-space:pre-wrap;";
      ta.placeholder = q.placeholder || "";
      ta.value = (answers[q.key] && answers[q.key].value) || "";
      surveyOptionsEl.appendChild(ta);
      const b = document.createElement("button");
      b.type = "button";
      b.className = "survey-opt";
      b.style.marginTop = "10px";
      b.textContent = "다음 →";
      b.onclick = () => choose({ label: ta.value.trim(), value: ta.value.trim() });
      surveyOptionsEl.appendChild(b);
    } else {
      q.options.forEach(opt => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "survey-opt";
        b.textContent = opt.label;
        if(answers[q.key] && answers[q.key].label === opt.label){
          b.classList.add("picked");
        }
        b.onclick = () => choose(opt);
        surveyOptionsEl.appendChild(b);
      });
    }
    surveyBackBtn.disabled = qIndex === 0;
  }

  function choose(opt){
    const q = questions[qIndex];
    answers[q.key] = opt;
    if(q.type !== "text"){
      [...surveyOptionsEl.children].forEach(b => b.classList.remove("picked"));
      const btns = [...surveyOptionsEl.children];
      const idx = q.options.indexOf(opt);
      if(btns[idx]) btns[idx].classList.add("picked");
    }
    setTimeout(() => {
      if(qIndex < questions.length - 1){
        qIndex++;
        renderStep();
      } else {
        finishSurvey();
      }
    }, 220);
  }

  surveyBackBtn.addEventListener("click", () => {
    if(qIndex > 0){ qIndex--; renderStep(); }
  });
  surveySkipBtn.addEventListener("click", () => {
    if(qIndex < questions.length - 1){
      qIndex++;
      renderStep();
    } else {
      finishSurvey();
    }
  });

  function startSurvey(){
    buildQuestions();
    qIndex = 0;
    renderStep();
    surveyForm.style.display = "block";
    surveyResults.style.display = "none";
  }

  openSurveyBtn.addEventListener("click", () => {
    startSurvey();
    surveyOverlay.classList.add("open");
  });
  closeSurveyBtn.addEventListener("click", () => surveyOverlay.classList.remove("open"));
  surveyOverlay.addEventListener("click", (e) => {
    if(e.target === surveyOverlay) surveyOverlay.classList.remove("open");
  });

  function finishSurvey(){
    const sGenre = answers.genre ? [answers.genre.value] : [];
    const sPairing = [answers.gong, answers.soo].filter(Boolean).map(a => a.value);
    const sCp = answers.cp ? [answers.cp.value] : [];
    const sAge = answers.age ? answers.age.value : "all";
    const sLength = answers.length ? answers.length.value : "all";
    const sStatus = answers.length ? (answers.length.status || null) : null;

    const scored = allPosts.map(post => {
      const genre = post.genreKeywords || post.keywords || [];
      const pairing = post.pairingKeywords || [];
      const allTags = [...genre, ...pairing];
      const cp = post.cp || [];
      let score = 0;
      const matchedTags = [];
      const fuzzyMatch = (val) => allTags.find(t => t.includes(val) || val.includes(t));
      sGenre.forEach(g => { const m = fuzzyMatch(g); if(m){ score++; matchedTags.push(m); } });
      sPairing.forEach(p => { const m = fuzzyMatch(p); if(m){ score++; matchedTags.push(m); } });
      sCp.forEach(c => { if(cp.includes(c)){ score++; matchedTags.push(c); } });
      if(sStatus && post.status === sStatus) score += 1;
      if(sAge !== "all" && (post.age || "all-ages") === sAge) score += 1;
      if(sLength !== "all" && post.lengthType === sLength) score += 1;

      return { post, score, matchedTags };
    })
    .sort((a,b) => b.score - a.score);

    // 취향과 하나라도 겹치는 글 위주로, 없으면 전체에서라도 채워서 최소 1개는 나오게 함
    let result = scored.filter(r => r.score > 0).slice(0, 10);
    if(result.length === 0){
      result = shuffle(scored).slice(0, 6);
    }
    const scoredFinal = result;

    resultList.innerHTML = "";
    if(scoredFinal.length === 0){
      resultCount.textContent = "추천할 글이 아직 없어요.";
      const p = document.createElement("p");
      p.style.cssText = "font-size:13px;color:var(--ink-soft);";
      p.textContent = "등록된 글이 부족해요. 잠시 후 다시 시도해주세요.";
      resultList.appendChild(p);
    } else {
      resultCount.textContent = `${scoredFinal.length}편을 추천해요`;
      scoredFinal.forEach(({post, matchedTags}) => {
        const card = document.createElement("div");
        card.className = "result-card";
        const a = document.createElement("a");
        a.href = post.link; a.target = "_blank"; a.rel = "noopener noreferrer";
        a.className = "rtitle"; a.textContent = post.title;
        const author = document.createElement("span");
        author.className = "rauthor"; author.textContent = "by " + post.author;
        card.appendChild(a); card.appendChild(author);
        if(matchedTags.length){
          const m = document.createElement("div");
          m.className = "rmatch";
          m.textContent = "겹치는 취향: " + [...new Set(matchedTags)].join(", ");
          card.appendChild(m);
        }
        resultList.appendChild(card);
      });
    }
    surveyForm.style.display = "none";
    surveyResults.style.display = "block";
  }

  surveyRetryBtn.addEventListener("click", () => {
    startSurvey();
  });

  loadPosts();
</script>
