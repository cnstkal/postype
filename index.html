<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포타꽂이 — 내 취향 포스타입 아카이브</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');

  :root{
    --bg:#FAFAFA;
    --ink:#161616;
    --ink-soft:#8A8A8A;
    --accent:#2F5CE0;
    --accent-soft:#EAEFFC;
    --line:#E7E7E7;
    --card:#FFFFFF;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Pretendard', sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .wrap{max-width:760px;margin:0 auto;padding:64px 24px 120px;}

  header{margin-bottom:40px;}
  h1{
    font-family:'Pretendard', sans-serif;
    font-size:26px;
    font-weight:700;
    margin:0 0 8px;
    line-height:1.3;
    letter-spacing:-0.02em;
  }
  .sub{color:var(--ink-soft);font-size:14px;line-height:1.6;max-width:520px;}

  .search-row{
    display:flex; gap:10px; margin-bottom:36px;
  }
  .search-row input{
    flex:1;
    padding:14px 16px;
    border:1.5px solid var(--line);
    background:var(--card);
    border-radius:10px;
    font-size:15px;
    font-family:inherit;
    color:var(--ink);
    outline:none;
    transition:border-color .15s;
  }
  .search-row input:focus{border-color:var(--accent);}

  .filter-tabs{display:flex;gap:6px;margin-bottom:28px;flex-wrap:wrap;}
  .filter-tabs button{
    padding:7px 14px;
    border-radius:999px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--ink-soft);
    font-size:13px;
    cursor:pointer;
    font-family:inherit;
    transition:all .15s;
  }
  .filter-tabs button.active{
    background:var(--accent); border-color:var(--accent); color:#fff;
  }

  details.add-box{
    margin-bottom:40px;
    border:1px solid var(--line);
    border-radius:12px;
    background:var(--card);
    padding:0;
    overflow:hidden;
  }
  details.add-box summary{
    padding:16px 20px;
    cursor:pointer;
    font-weight:600;
    font-size:14px;
    color:var(--ink);
    list-style:none;
    display:flex; align-items:center; gap:8px;
  }
  details.add-box summary::before{
    content:"＋"; color:var(--accent); font-size:16px; font-weight:700;
  }
  details.add-box[open] summary::before{content:"－";}
  .add-form{
    padding:4px 20px 22px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  .add-form .full{grid-column:1/-1;}
  .add-form label{
    font-size:12px; color:var(--ink-soft); margin-bottom:5px; display:block;
  }
  .add-form input{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    font-family:inherit;
    font-size:14px;
    background:#fff;
    color:var(--ink);
  }
  .add-form input:focus{outline:none; border-color:var(--accent);}
  .add-form button[type="submit"]{
    grid-column:1/-1;
    margin-top:6px;
    padding:12px;
    background:var(--ink);
    color:var(--paper);
    border:none;
    border-radius:8px;
    font-family:inherit;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    transition:background .15s;
  }
  .add-form button[type="submit"]:hover{background:var(--accent);}
  .add-form .msg{grid-column:1/-1; font-size:13px; color:var(--accent); min-height:16px;}

  .seg{display:flex; gap:6px;}
  .cp-seg{flex-wrap:wrap;}
  .seg-btn{
    padding:9px 16px;
    border:1px solid var(--line);
    border-radius:8px;
    background:#fff;
    color:var(--ink-soft);
    font-family:inherit;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  .seg-btn.active{
    background:var(--ink);
    border-color:var(--ink);
    color:#fff;
  }
  .seg-extra{
    background:#F5F5F5;
    border-radius:8px;
    padding:14px;
  }
  .extra-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  .extra-row label{font-size:12px; color:var(--ink-soft); margin-bottom:5px; display:block;}
  .extra-row input{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    font-family:inherit;
    font-size:14px;
    background:#fff;
    color:var(--ink);
  }

  .count-row{
    font-size:13px; color:var(--ink-soft); margin-bottom:14px;
  }

  .list{display:flex; flex-direction:column; gap:14px;}
  .post-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:20px 22px;
    display:flex;
    flex-direction:column;
    gap:8px;
    transition:border-color .15s, transform .1s;
  }
  .post-card:hover{border-color:var(--accent);}
  .post-top{display:flex; justify-content:space-between; align-items:flex-start; gap:12px;}
  .post-title{
    font-family:'Pretendard', sans-serif;
    font-weight:700;
    font-size:19px;
    line-height:1.4;
    color:var(--ink);
    text-decoration:none;
  }
  .post-title:hover{color:var(--accent);}
  .post-author{
    font-size:13px; color:var(--ink-soft);
    white-space:nowrap; padding-top:4px;
  }
  .badge-row{display:flex; gap:6px; flex-wrap:wrap;}
  .badge{
    font-size:11.5px;
    padding:3px 9px;
    border-radius:6px;
    font-weight:600;
    background:#F0F0F0;
    color:var(--ink-soft);
  }
  .badge.ongoing{background:#FFF3D6; color:#9A6B00;}
  .badge.done{background:#E8F5EA; color:#2E7D32;}
  .keywords{display:flex; flex-wrap:wrap; gap:6px; align-items:center;}
  .kw-label{
    font-size:11px; color:var(--ink-soft); margin-right:2px; font-weight:500;
  }
  .kw{
    font-size:11.5px;
    padding:3px 10px;
    border-radius:999px;
    font-weight:600;
    cursor:pointer;
    border:none;
  }
  .kw.genre{
    background:var(--accent-soft);
    color:var(--accent);
  }
  .kw.pairing{
    background:#FDEDE9;
    color:#D14B32;
  }
  .kw.cp{
    background:#F1EAFB;
    color:#7A3FC2;
  }
  .del-btn{
    background:none;border:none;color:var(--ink-soft);
    font-size:12px;cursor:pointer;align-self:flex-end;
    opacity:0.5;
  }
  .del-btn:hover{opacity:1;color:var(--accent);}

  .empty{
    text-align:center; padding:60px 20px; color:var(--ink-soft);
    font-family:'Pretendard', sans-serif; font-size:16px;
  }

  @media (max-width:600px){
    .wrap{padding:36px 16px 100px;}
    h1{font-size:22px;}
    .add-form{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>포스타입 글 아카이브</h1>
    <p class="sub">제목, 작가, 키워드로 검색하고 바로 원문으로 이동하세요.</p>
  </header>

  <div class="search-row">
    <input type="text" id="searchInput" placeholder="제목 / 작가 / 키워드로 검색…">
  </div>
  <div class="filter-tabs" id="filterTabs">
    <button data-mode="all" class="active">전체</button>
    <button data-mode="title">제목</button>
    <button data-mode="author">작가</button>
    <button data-mode="genre">장르</button>
    <button data-mode="pairing">공수</button>
    <button data-mode="cp">CP</button>
  </div>

  <details class="add-box">
    <summary>새 글 등록하기</summary>
    <form class="add-form" id="addForm" autocomplete="off">
      <div class="full">
        <label>제목</label>
        <input type="text" id="f_title" required placeholder="글 제목" autocomplete="off">
      </div>
      <div>
        <label>작가</label>
        <input type="text" id="f_author" required placeholder="작가명" autocomplete="off">
      </div>
      <div>
        <label>링크</label>
        <input type="url" id="f_link" required placeholder="https://..." autocomplete="off">
      </div>
      <div>
        <label>장르 키워드 (쉼표로 구분)</label>
        <input type="text" id="f_genre" placeholder="예: 로맨스, 회귀, 현판, 힐링" autocomplete="off">
      </div>
      <div>
        <label>공수 키워드 (쉼표로 구분)</label>
        <input type="text" id="f_pairing" placeholder="예: 유공, 순정남수, 서로공수" autocomplete="off">
      </div>

      <div class="full">
        <label>CP (복수 선택 가능)</label>
        <div class="seg cp-seg" id="cpSeg">
          <button type="button" class="seg-btn" data-val="섷윤">섷윤</button>
          <button type="button" class="seg-btn" data-val="몽윦">몽윦</button>
          <button type="button" class="seg-btn" data-val="솽윦">솽윦</button>
          <button type="button" class="seg-btn" data-val="낫윤">낫윤</button>
          <button type="button" class="seg-btn" data-val="밍윦">밍윦</button>
          <button type="button" class="seg-btn" data-val="웡윤">웡윤</button>
          <button type="button" class="seg-btn" data-val="쫑윦">쫑윦</button>
        </div>
      </div>

      <div class="full">
        <label>연재 구분</label>
        <div class="seg" id="lengthSeg">
          <button type="button" class="seg-btn active" data-val="단편">단편</button>
          <button type="button" class="seg-btn" data-val="장편">장편</button>
        </div>
      </div>

      <div class="full seg-extra" id="lengthExtra" style="display:none;">
        <div class="extra-row">
          <div>
            <label>총 화수</label>
            <input type="number" id="f_episodes" min="1" placeholder="예: 24" autocomplete="off">
          </div>
          <div>
            <label>연재 상태</label>
            <div class="seg" id="statusSeg">
              <button type="button" class="seg-btn active" data-val="완결">완결</button>
              <button type="button" class="seg-btn" data-val="미완결">미완결</button>
            </div>
          </div>
        </div>
      </div>

      <button type="submit">등록하기</button>
      <div class="msg" id="formMsg"></div>
    </form>
  </details>

  <div class="count-row" id="countRow"></div>
  <div class="list" id="list"></div>
  <div class="empty" id="emptyMsg" style="display:none;">아직 등록된 글이 없어요. 위에서 새 글을 등록해보세요.</div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getFirestore, collection, addDoc, getDocs, deleteDoc, doc,
    query, orderBy, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyARs6k0H3CMkyxUY4S18HhAT40uF8EzG0E",
    authDomain: "postype-47733.firebaseapp.com",
    projectId: "postype-47733",
    storageBucket: "postype-47733.firebasestorage.app",
    messagingSenderId: "438349461619",
    appId: "1:438349461619:web:7da69cf90d6a0a8c779206"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const postsRef = collection(db, "posts");

  let allPosts = [];
  let mode = "all"; // all | title | author | genre | pairing

  const listEl = document.getElementById("list");
  const emptyMsg = document.getElementById("emptyMsg");
  const countRow = document.getElementById("countRow");
  const searchInput = document.getElementById("searchInput");
  const filterTabs = document.getElementById("filterTabs");
  const addForm = document.getElementById("addForm");
  const formMsg = document.getElementById("formMsg");
  const lengthSeg = document.getElementById("lengthSeg");
  const statusSeg = document.getElementById("statusSeg");
  const lengthExtra = document.getElementById("lengthExtra");
  const cpSeg = document.getElementById("cpSeg");

  let lengthType = "단편";
  let statusType = "완결";
  let selectedCp = [];

  cpSeg.addEventListener("click", (e) => {
    const btn = e.target.closest(".seg-btn");
    if(!btn) return;
    const val = btn.dataset.val;
    if(selectedCp.includes(val)){
      selectedCp = selectedCp.filter(v => v !== val);
      btn.classList.remove("active");
    } else {
      selectedCp.push(val);
      btn.classList.add("active");
    }
  });

  lengthSeg.addEventListener("click", (e) => {
    const btn = e.target.closest(".seg-btn");
    if(!btn) return;
    [...lengthSeg.children].forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    lengthType = btn.dataset.val;
    lengthExtra.style.display = lengthType === "장편" ? "block" : "none";
  });

  statusSeg.addEventListener("click", (e) => {
    const btn = e.target.closest(".seg-btn");
    if(!btn) return;
    [...statusSeg.children].forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    statusType = btn.dataset.val;
  });

  filterTabs.addEventListener("click", (e) => {
    const btn = e.target.closest("button");
    if(!btn) return;
    [...filterTabs.children].forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    mode = btn.dataset.mode;
    render();
  });

  searchInput.addEventListener("input", render);

  async function loadPosts(){
    try{
      const q = query(postsRef, orderBy("createdAt", "desc"));
      const snap = await getDocs(q);
      allPosts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    }catch(err){
      // orderBy may fail if createdAt missing on old docs; fallback
      const snap = await getDocs(postsRef);
      allPosts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    }
    render();
  }

  function matches(post, term){
    if(!term) return true;
    const t = term.toLowerCase();
    const genre = (post.genreKeywords || post.keywords || []).join(" ").toLowerCase();
    const pairing = (post.pairingKeywords || []).join(" ").toLowerCase();
    const cp = (post.cp || []).join(" ").toLowerCase();
    if(mode === "title") return (post.title || "").toLowerCase().includes(t);
    if(mode === "author") return (post.author || "").toLowerCase().includes(t);
    if(mode === "genre") return genre.includes(t);
    if(mode === "pairing") return pairing.includes(t);
    if(mode === "cp") return cp.includes(t);
    // all
    return (post.title||"").toLowerCase().includes(t)
      || (post.author||"").toLowerCase().includes(t)
      || genre.includes(t)
      || pairing.includes(t)
      || cp.includes(t);
  }

  function render(){
    const term = searchInput.value.trim();
    const filtered = allPosts.filter(p => matches(p, term));

    countRow.textContent = `총 ${allPosts.length}편 중 ${filtered.length}편`;
    listEl.innerHTML = "";
    emptyMsg.style.display = filtered.length === 0 ? "block" : "none";
    if(filtered.length === 0 && allPosts.length > 0){
      emptyMsg.textContent = "검색 결과가 없어요.";
    } else if (allPosts.length === 0){
      emptyMsg.textContent = "아직 등록된 글이 없어요. 위에서 새 글을 등록해보세요.";
    }

    filtered.forEach(post => {
      const card = document.createElement("div");
      card.className = "post-card";

      const top = document.createElement("div");
      top.className = "post-top";

      const a = document.createElement("a");
      a.href = post.link;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.className = "post-title";
      a.textContent = post.title;

      const author = document.createElement("div");
      author.className = "post-author";
      author.textContent = post.author ? `by ${post.author}` : "";

      top.appendChild(a);
      top.appendChild(author);
      card.appendChild(top);

      const badgeRow = document.createElement("div");
      badgeRow.className = "badge-row";
      const lengthBadge = document.createElement("span");
      lengthBadge.className = "badge";
      if(post.lengthType === "장편"){
        const epi = post.episodes ? `전 ${post.episodes}화` : "장편";
        lengthBadge.textContent = epi;
        badgeRow.appendChild(lengthBadge);

        const statusBadge = document.createElement("span");
        statusBadge.className = "badge " + (post.status === "완결" ? "done" : "ongoing");
        statusBadge.textContent = post.status || "미완결";
        badgeRow.appendChild(statusBadge);
      } else {
        lengthBadge.textContent = "단편";
        badgeRow.appendChild(lengthBadge);
      }
      card.appendChild(badgeRow);

      const genreList = post.genreKeywords || post.keywords || [];
      const pairingList = post.pairingKeywords || [];

      function addChipRow(list, type, labelText){
        if(!list.length) return;
        const kwWrap = document.createElement("div");
        kwWrap.className = "keywords";
        const label = document.createElement("span");
        label.className = "kw-label";
        label.textContent = labelText;
        kwWrap.appendChild(label);
        list.forEach(k => {
          const chip = document.createElement("button");
          chip.className = "kw " + type;
          chip.textContent = "#" + k;
          chip.onclick = () => {
            searchInput.value = k;
            [...filterTabs.children].forEach(b => b.classList.remove("active"));
            filterTabs.querySelector(`[data-mode="${type}"]`).classList.add("active");
            mode = type;
            render();
          };
          kwWrap.appendChild(chip);
        });
        card.appendChild(kwWrap);
      }

      addChipRow(genreList, "genre", "장르");
      addChipRow(pairingList, "pairing", "공수");
      addChipRow(post.cp || [], "cp", "CP");

      const del = document.createElement("button");
      del.className = "del-btn";
      del.textContent = "삭제";
      del.onclick = async () => {
        if(!confirm("이 글을 목록에서 삭제할까요?")) return;
        await deleteDoc(doc(db, "posts", post.id));
        await loadPosts();
      };
      card.appendChild(del);

      listEl.appendChild(card);
    });
  }

  addForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const title = document.getElementById("f_title").value.trim();
    const author = document.getElementById("f_author").value.trim();
    const link = document.getElementById("f_link").value.trim();
    const genreKeywords = document.getElementById("f_genre").value
      .split(",").map(s => s.trim()).filter(Boolean);
    const pairingKeywords = document.getElementById("f_pairing").value
      .split(",").map(s => s.trim()).filter(Boolean);
    const episodes = lengthType === "장편"
      ? (parseInt(document.getElementById("f_episodes").value, 10) || null)
      : null;
    const status = lengthType === "장편" ? statusType : null;

    if(!title || !author || !link){
      formMsg.textContent = "제목, 작가, 링크는 필수예요.";
      return;
    }

    formMsg.textContent = "등록 중…";
    try{
      await addDoc(postsRef, {
        title, author, link, genreKeywords, pairingKeywords,
        lengthType, episodes, status, cp: selectedCp,
        createdAt: serverTimestamp()
      });
      addForm.reset();
      // 세그먼트 버튼과 상태값 초기화 (자동완성/이전 선택 남지 않도록)
      [...lengthSeg.children].forEach(b => b.classList.remove("active"));
      lengthSeg.children[0].classList.add("active");
      lengthType = "단편";
      lengthExtra.style.display = "none";
      [...statusSeg.children].forEach(b => b.classList.remove("active"));
      statusSeg.children[0].classList.add("active");
      statusType = "완결";
      [...cpSeg.children].forEach(b => b.classList.remove("active"));
      selectedCp = [];
      formMsg.textContent = "등록 완료!";
      setTimeout(() => formMsg.textContent = "", 1500);
      await loadPosts();
    }catch(err){
      formMsg.textContent = "등록 중 오류가 발생했어요: " + err.message;
    }
  });

  loadPosts();
</script>
</body>
</html>
